<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presidio Vault - Anonymization Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --success: #10b981;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2rem;
        }

        .badge {
            background-color: var(--success);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .main-content {
            display: flex;
            gap: 2rem;
            align-items: stretch;
        }

        .dropzone-container {
            flex: 1;
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .dropzone-container.dragover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .dropzone-container input[type="file"] {
            display: none;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 1rem;
        }
        
        .btn:hover {
            background-color: var(--accent-hover);
        }

        .metrics-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .metric-card p {
            margin: 0 0 0.5rem 0;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .metric-card h3 {
            margin: 0;
            font-size: 2rem;
            color: var(--accent);
        }

        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #download-btn {
            display: none;
            background-color: var(--success);
            margin-top: 1rem;
            text-decoration: none;
            display: inline-block;
        }
        
        #download-wrapper {
            display: none;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Presidio Vault</h1>
            <div class="badge">Flask Pipeline Active</div>
        </header>

        <!-- Main Workspace -->
        <div class="main-content">
            
            <!-- File Dropzone -->
            <div class="dropzone-container" id="dropzone">
                <div class="spinner" id="spinner"></div>
                
                <div id="upload-content">
                    <button class="btn" onclick="document.getElementById('file-upload').click()">Select .docx File</button>
                    <p style="color: var(--text-muted);">Drag and drop files here or click to select files</p>
                </div>
                
                <input type="file" id="file-upload" accept=".docx" />
                
                <div id="download-wrapper">
                    <p style="color: var(--success); font-weight: 500;">Processing Complete!</p>
                    <a href="#" class="btn" id="download-btn" style="display: inline-block;">Download Redacted .docx</a>
                    <br>
                    <a href="/download-audit" class="btn" id="audit-btn" style="display: inline-block; background-color: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 0.5rem;">Download Audit Log (JSON)</a>
                </div>
            </div>

            <!-- KPI Metrics -->
            <div class="metrics-container">
                <div class="metric-card">
                    <p>Recall</p>
                    <h3 id="metric-recall">0.0%</h3>
                </div>
                <div class="metric-card">
                    <p>Precision</p>
                    <h3 id="metric-precision">0.0%</h3>
                </div>
                <div class="metric-card">
                    <p>Accuracy</p>
                    <h3 id="metric-accuracy">0.0%</h3>
                </div>
                <div class="metric-card">
                    <p>System Status</p>
                    <h3 id="metric-status" style="color: var(--success); font-size: 1.25rem;">Idle</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-upload');
        const uploadContent = document.getElementById('upload-content');
        const spinner = document.getElementById('spinner');
        const downloadWrapper = document.getElementById('download-wrapper');
        const downloadBtn = document.getElementById('download-btn');

        // Metrics DOM
        const mRecall = document.getElementById('metric-recall');
        const mPrecision = document.getElementById('metric-precision');
        const mAccuracy = document.getElementById('metric-accuracy');
        const mStatus = document.getElementById('metric-status');

        // Drag & Drop events
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.docx')) {
                alert('Please upload a .docx file.');
                return;
            }

            // UI Loading State
            uploadContent.style.display = 'none';
            downloadWrapper.style.display = 'none';
            spinner.style.display = 'block';
            mStatus.textContent = "Processing...";
            mStatus.style.color = "var(--text-muted)";

            // Prepare Form Data
            const formData = new FormData();
            formData.append('file', file);

            // Fetch to Flask backend
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error("Upload Failed");
                return response.json();
            })
            .then(data => {
                // UI Success State
                spinner.style.display = 'none';
                downloadWrapper.style.display = 'block';
                
                mStatus.textContent = "Complete";
                mStatus.style.color = "var(--success)";

                // Update Metrics
                mRecall.textContent = data.metrics.recall + "%";
                mPrecision.textContent = data.metrics.precision + "%";
                mAccuracy.textContent = data.metrics.accuracy + "%";

                // Setup Download
                downloadBtn.href = data.download_url;
            })
            .catch(error => {
                alert(error);
                spinner.style.display = 'none';
                uploadContent.style.display = 'block';
                mStatus.textContent = "Error";
                mStatus.style.color = "#ef4444";
            });
        }
    </script>
</body>
</html>
